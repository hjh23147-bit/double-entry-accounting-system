<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المحاسبة المالي المزدوج - تسجيل الدخول الملكي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        royalNavy: { 800: '#0f1c3f', 900: '#0a1128', 950: '#060a17' },
                        royalGold: { 300: '#fef08a', 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .glass-card-royal {
            background: rgba(10, 17, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.35);
            box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(234, 179, 8, 0.15);
        }
        .glass-input-royal {
            background: rgba(6, 10, 23, 0.5);
            border: 1px solid rgba(234, 179, 8, 0.25);
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .glass-input-royal:focus {
            border-color: #facc15;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-royalNavy-950 via-royalNavy-900 to-royalNavy-800 text-white">

    <div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-gradient-to-br from-amber-500/20 via-yellow-600/15 to-transparent blur-3xl pointer-events-none animate-pulse"></div>

    <main class="w-full max-w-md relative z-10 my-8">
        <div class="glass-card-royal rounded-3xl p-7 sm:p-10">
            <div class="text-center mb-8 flex flex-col items-center">
                <div class="w-20 h-20 mb-4 rounded-3xl bg-gradient-to-tr from-amber-500/20 via-yellow-500/30 to-amber-600/20 border border-royalGold-400/40 flex items-center justify-center shadow-[0_0_20px_rgba(234,179,8,0.25)]">
                    <i class="fa-solid fa-scale-balanced text-4xl text-royalGold-400"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black text-white mb-2">نظام المحاسبة المالي المزدوج</h1>
                <p class="text-sm text-royalGold-300 font-semibold flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-royalGold-400 animate-pulse"></span>
                    تسجيل الدخول للنظام الملكي
                </p>
            </div>

            <form id="loginForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                <div class="space-y-2">
                    <label for="username" class="block text-sm font-bold text-white">اسم المستخدم</label>
                    <div class="relative flex items-center">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-royalGold-400 pointer-events-none">
                            <i class="fa-regular fa-user text-lg"></i>
                        </span>
                        <input type="text" id="username" value="admin" required class="glass-input-royal w-full pr-11 pl-4 py-3.5 rounded-2xl text-white placeholder-slate-400 text-sm focus:outline-none font-medium">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="password" class="block text-sm font-bold text-white">كلمة المرور</label>
                    <div class="relative flex items-center">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-4 text-royalGold-400 pointer-events-none">
                            <i class="fa-solid fa-lock text-lg"></i>
                        </span>
                        <input type="password" id="password" value="2252101" required class="glass-input-royal w-full pr-11 pl-12 py-3.5 rounded-2xl text-white text-sm focus:outline-none font-medium">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 left-0 flex items-center pl-4 text-royalGold-400">
                            <i id="passwordEyeIcon" class="fa-regular fa-eye-slash text-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs sm:text-sm pt-1">
                    <label class="flex items-center space-x-2 space-x-reverse cursor-pointer select-none">
                        <input type="checkbox" checked class="w-4 h-4 rounded text-royalGold-500 bg-white/10">
                        <span class="text-slate-200">تذكرني</span>
                    </label>
                    <a href="#forgot" onclick="alert('تواصل مع مدير النظام لإعادة التعيين.')" class="text-royalGold-400 font-bold hover:underline">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 text-royalNavy-950 font-black text-base shadow-lg hover:shadow-yellow-500/50 transition-all duration-300 flex items-center justify-center space-x-2 space-x-reverse">
                    <span id="btnText">تسجيل الدخول</span>
                    <i id="btnIcon" class="fa-solid fa-arrow-left text-sm"></i>
                </button>
            </form>
        </div>
        <p class="text-center text-xs text-royalGold-400/70 mt-6">&copy; 2026 جميع الحقوق محفوظة - وسام Sys للنظم المحاسبية المزدوجة</p>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('passwordEyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fa-regular fa-eye text-lg text-white';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fa-regular fa-eye-slash text-lg';
            }
        }
        function handleFormSubmit(e) {
            e.preventDefault();
            const uname = document.getElementById('username').value;
            const pword = document.getElementById('password').value;
            if (uname === 'admin' && pword === '2252101') {
                alert(`مرحباً بك يا ${uname}! تم تسجيل الدخول بنجاح إلى نظام المحاسبة المالي المزدوج.`);
                window.location.href = '/api';
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة.');
            }
        }
    </script>
</body>
</html>
